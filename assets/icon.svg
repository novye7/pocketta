<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Source for the 48 and 128 px icons. Coordinates sit on even units, which are whole pixels at 48 px. -->
  <rect width="96" height="96" rx="22" fill="#0d0d0d"/>
  <!-- Where the component was. -->
  <rect x="14" y="40" width="48" height="38" rx="9" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="3.5" stroke-dasharray="6.5 5.6" stroke-linecap="round"/>
  <!-- The component, lifted out. -->
  <g transform="translate(56 38) rotate(-9)">
    <rect x="-24" y="-19" width="48" height="38" rx="9" fill="#ffffff" stroke="#0d0d0d" stroke-width="4" paint-order="stroke"/>
    <rect x="-16" y="-11" width="15" height="6" rx="3" fill="#3d95ff"/>
    <rect x="-16" y="0" width="32" height="4.5" rx="2.25" fill="#c6cbd4"/>
    <rect x="-16" y="8" width="21" height="4.5" rx="2.25" fill="#c6cbd4"/>
  </g>
</svg>
