name: Extension checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm install --global agent-browser@0.38.2
      - run: agent-browser install
      - run: npm run test:browser
